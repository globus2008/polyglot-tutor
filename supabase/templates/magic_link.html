<h2>Přihlášení do Polyglot Tutor</h2>
<p>Váš přihlašovací kód:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
<p>Zadejte ho na přihlašovací stránce, nebo klikněte na odkaz:</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email">Přihlásit se</a></p>
<p style="color:#666">Kód i odkaz platí jednu hodinu. Pokud jste o přihlášení nežádali, e-mail ignorujte.</p>
