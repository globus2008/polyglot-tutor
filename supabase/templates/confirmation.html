<h2>Vítejte v Polyglot Tutor</h2>
<p>Váš kód pro dokončení registrace:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
<p>Zadejte ho na přihlašovací stránce, nebo klikněte na odkaz:</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email">Dokončit registraci</a></p>
<p style="color:#666">Kód i odkaz platí jednu hodinu. Pokud jste o registraci nežádali, e-mail ignorujte.</p>
