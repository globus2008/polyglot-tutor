<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Polyglot Tutor – offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #16181d; --muted: #5d6472; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1014; --fg: #e8eaee; --muted: #9aa2b1; --accent: #818cf8; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      p { color: var(--muted); max-width: 22rem; margin: 8px auto; }
      button { margin-top: 16px; border: 0; border-radius: 12px; padding: 10px 18px; background: var(--accent); color: #fff; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline · Jste offline</h1>
      <p>Polyglot Tutor needs an internet connection for lessons and reviews.</p>
      <p>Lekce i opakování potřebují připojení k internetu.</p>
      <button type="button" onclick="location.reload()">Try again · Zkusit znovu</button>
    </main>
  </body>
</html>
